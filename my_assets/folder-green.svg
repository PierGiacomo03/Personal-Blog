<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 82" shape-rendering="geometricPrecision">
  <defs>
    <linearGradient id="tabGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00c060"/>
      <stop offset="100%" stop-color="#007838"/>
    </linearGradient>
    <linearGradient id="bodyBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00b858"/>
      <stop offset="100%" stop-color="#006832"/>
    </linearGradient>
    <linearGradient id="bodyFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00e070"/>
      <stop offset="38%"  stop-color="#00b050"/>
      <stop offset="100%" stop-color="#005c2c"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bodyClip">
      <path d="M0 36 L100 36 L100 76 Q100 82 94 82 L6 82 Q0 82 0 76Z"/>
    </clipPath>
  </defs>

  <!-- Back panel (tab + rear body) -->
  <path d="M6 22 Q6 16 12 16 L38 16 Q42 16 44 20 L49 27 L94 27 Q100 27 100 33 L100 76 Q100 82 94 82 L6 82 Q0 82 0 76 L0 28 Q0 22 6 22Z"
        fill="url(#bodyBack)"/>

  <!-- Front face -->
  <path d="M0 36 L100 36 L100 76 Q100 82 94 82 L6 82 Q0 82 0 76Z"
        fill="url(#bodyFront)"/>

  <!-- Shine layer (top half of front) -->
  <rect x="0" y="36" width="100" height="23" fill="url(#shineGrad)" clip-path="url(#bodyClip)"/>

  <!-- Subtle bottom shadow on body -->
  <path d="M0 68 L100 68 L100 76 Q100 82 94 82 L6 82 Q0 82 0 76Z"
        fill="#000" opacity="0.18"/>

  <!-- Top edge of front face — bright highlight -->
  <line x1="1" y1="36" x2="99" y2="36"
        stroke="url(#edgeGrad)" stroke-width="1.2"/>

  <!-- Outer border glow -->
  <path d="M6 22 Q6 16 12 16 L38 16 Q42 16 44 20 L49 27 L94 27 Q100 27 100 33 L100 76 Q100 82 94 82 L6 82 Q0 82 0 76 L0 28 Q0 22 6 22Z"
        fill="none" stroke="#00ff88" stroke-width="1.2" stroke-opacity="0.5"
        filter="url(#softGlow)"/>
</svg>
